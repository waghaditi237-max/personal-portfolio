<section id="skills" class="skills-bar-section">


  <h2 class="skills-heading"><span> My Skills</span></h2>
  <p class="skills-desc">
    I focus on building clean, responsive, and user-friendly digital experiences.
  </p>

  <div class="skills-list">

    <div class="skill" data-percent="90">
      <div class="skill-info">
        <span>HTML & CSS</span>
        <span class="count">0%</span>
      </div>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>

    <div class="skill" data-percent="85">
      <div class="skill-info">
        <span>JavaScript</span>
        <span class="count">0%</span>
      </div>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>

    <div class="skill" data-percent="88">
      <div class="skill-info">
        <span>MongoDB</span>
        <span class="count">0%</span>
      </div>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>

    <div class="skill" data-percent="87">
      <div class="skill-info">
        <span>SQL</span>
        <span class="count">0%</span>
      </div>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>

    <div class="skill" data-percent="80">
      <div class="skill-info">
        <span>Node.js</span>
        <span class="count">0%</span>
      </div>

    </div>

    <div class="skill" data-percent="90">
      <div class="skill-info">
        <span>Figma</span>
        <span class="count">0%</span>
      </div>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>

  </div>
</section>


<script>
document.addEventListener("DOMContentLoaded", () => {

  const skills = document.querySelectorAll(".skill");
  let animated = false;

  function animateSkills() {
    skills.forEach(skill => {
      const target = skill.dataset.percent;
      const bar = skill.querySelector(".progress-bar");
      const count = skill.querySelector(".count");

      let current = 0;

      const interval = setInterval(() => {
        if (current >= target) {
          clearInterval(interval);
        } else {
          current++;
          count.textContent = current + "%";
          bar.style.width = current + "%";
        }
      }, 15);
    });
  }

  // Trigger on scroll
  window.addEventListener("scroll", () => {
    const section = document.getElementById("skills");
    const sectionTop = section.getBoundingClientRect().top;
    const screenHeight = window.innerHeight;

    if (sectionTop < screenHeight - 150 && !animated) {
      animateSkills();
      animated = true;
    }
  });

});
</script>
